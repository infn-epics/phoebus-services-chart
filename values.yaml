# Default values for phoebus-services-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
initcontainer: 
  image: "ghcr.io/infn-epics/container-init:latest"

image:
  repository: baltig.infn.it:4567/epics-containers/phoebus-base-docker
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "latest"
  webolog: baltig.infn.it:4567/epics-containers/phoebus-olog-web

olog:
  image: "ghcr.io/infn-epics/org-phoebus-service-olog:latest"
  # Comma-separated list of authentication providers
  # Supported values: inMemory, ldap, embeddedLdap, activeDirectory, jwt
  authenticationProviders: "embeddedLdap,jwt"

pvws:
  image: "ghcr.io/infn-epics/pvws-docker:latest"
  host: pvws
  port: 8080

dbwr:
  image: "ghcr.io/infn-epics/dbwr-docker:latest"
  host: dbwr
  port: 8080

saveandrestore:
  image: "ghcr.io/infn-epics/phoebus/service-save-and-restore:master"
  

alarmserver:
  image: "ghcr.io/infn-epics/phoebus/service-alarm-server:master"

alarmlogger:
  image: "ghcr.io/infn-epics/phoebus/service-alarm-logger:master"

channelfinder:
  image: "ghcr.io/infn-epics/channelfinderservice:latest"
  user: "epics"
  password: "epics"

channelfinderFeeder:
  enabled: true
  schedule: "0 0 * * *"
  # Forbid + activeDeadlineSeconds work as a pair. With the Kubernetes default
  # (Allow) a hung run blocked nothing, so a SPARC feeder ran for 92 days (endless
  # PVA "no route to host" retries) alongside every nightly run. Forbid alone would
  # be worse: that one hung run would skip every future night. The deadline kills
  # it. Real runs take ~7-30 min (SPARC, the largest, ~28), so 4h is generous;
  # set activeDeadlineSeconds to 0/empty to disable.
  concurrencyPolicy: Forbid
  activeDeadlineSeconds: 14400
  image: "ghcr.io/infn-epics/channelfinder-service-feeder:latest"
  pvlistDir: "/nfs/config"
  noPva: false
  gitRepoConfig:
    url:          # optional override; falls back to top-level giturl
    path: "deploy/values.yaml"   # path to values.yaml inside the repo
    branch: ""    # optional override; falls back to top-level gitrev

# Beamline git repo — passed by epik8s-chart, used as fallback for feeder gitRepoConfig
giturl: ""
gitrev: ""
## Private Git: epik8s_secrets (key git_token, one token per host) and/or
## git_credentials_secret (key "gitconfig" + one token file per URL prefix,
## mounted at /etc/git-credentials). Both unset = unauthenticated clone.
# epik8s_secrets: epik8s-secret
# git_credentials_secret: epik8s-git-credentials


imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount: 
  # Specifies whether a service account should be created
  create: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "default"

podAnnotations: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80
  http:
    enable: false
    port: 8081
  loglevel: "INFO"

# Enable TLS termination and secure configurations

ingress:
  enabled: false
  enableHttp: true  # Enable HTTP-only ingress route alongside HTTPS
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
          port:
  
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

#alarmserver alarmlogger saveandrestore scanserver olog "webalarm"
phoebusservice: "saveandrestore"

elasticsearch:
  authorization:
    username: ""
    password: ""
  clusterName: elasticsearch
  network:
    host: localhost
    port: 9300 
  http:
    port: 9200
  # Name of the secret containing the Elasticsearch CA certificate
  # If set, the certificate will be mounted at /config/elasticsearch-ca.crt
  # The secret should contain a key named 'ca.crt'
  pubcertsecret: ""

mongo:
  database: ologAttachments
  host: mongo
  port: 27017

ldap:
  external:
    enable: false
    url: "ldaps://controlns02.nsls2.bnl.gov/dc=nsls2,dc=bnl,dc=gov"
    base: 
      dn: "dc=nsls2,dc=bnl,dc=gov"

kafka:
  host: kafka-controller-headless.backend.svc.cluster.local
  port: 9092


alarm:
  config: "Accelerator"
  topics: "Accelerator,ALARM,CONFIGS"
  settings: "settings.xml"      # - Import preferences (PV connectivity) from property format file
  econfig: "econfig.xml"        # - Export alarm configuration to file
  iconfig: "config.xml"        # - Import alarm configuration from file

epicsConfiguration:
  name:    ## load the epicsConfigurationMap
  gateway: ## if defined EPICS_CA_ADDR_LIST is overridden

staticIP:
gitRepoConfig:
  url:
# OAuth2/JWT authentication for save-and-restore service
  # When enabled, requests with Authorization: Bearer <token> are validated
  # against the OIDC provider. Non-bearer requests fall through to auth.impl.
oauth2:
  enabled: true
  issueUri: "https://idp-test.app.infn.it/auth/realms/aai"
  claimsName: "name"

nfsBackups:
    # - name: documents
    #   server: 192.168.197.157
    #   path: /sparcstorage/space2/Documents
    #   mountPath: /nfs/documents
    #   opt: "-o nolock"
    # - name: backups
    #   server: 192.168.197.157
    #   path: /sparcstorage/space2/Backups
    #   mountPath: /nfs/backups
    #   opt: "-o nolock"
ologBackup:
  title: Beamline Report
  enabled: true
  schedule: "1 0 * * *"
  image: python:3.11-slim
  ologUrl: "http://localhost:8080/Olog"
  username: "epics"
  password: "epics"

# Daily upload of the Olog entries to ARGUS Knowledge Hub (olog service only).
# Each entry becomes a Logbook Entry document in the facility's ARGUS workspace; overlapping runs and
# retries are safe. The token is a robot token of that workspace (ARGUS: workspace administration ->
# Robot tokens -> "Daily logbook upload"), kept in a Secret created by hand, never in git:
#   kubectl -n <beamline> create secret generic argus-olog-upload --from-literal=token=argus_bot_...
argusUpload:
  enabled: false
  schedule: "30 1 * * *"
  image: python:3.11-slim
  # The ARGUS API, e.g. https://argus-hub-api.example.org
  url: ""
  # The logbook's name in ARGUS (defaults to the beamline)
  facility: ""
  # Where a person opens an entry, with {id}, e.g. https://btf-webolog.example.org/logs/{id}
  entryUrl: ""
  # How far back each run looks: a missed night is caught by the next one
  lookbackDays: 2
  # true once, to send every entry already in the logbook; then back to false
  all: false
  tokenSecret:
    name: argus-olog-upload
    key: token
  # The Olog to read; empty means this release's own service
  ologUrl: ""

# CORS configuration for Olog service
# cors:
#   origins: "https://example.com"
#   methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
#   headers: "*"
#   credentials: "true"
#   maxAge: "3600"
# CORS configuration for web front-end access
# Configure these settings to allow cross-origin requests from web applications
cors:
  # Comma-separated list of allowed origins (e.g., "https://example.com,https://other.com")
  # origins: "https://your-frontend.example.com"
  
  # Comma-separated list of allowed HTTP methods
  # Default: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  # methods: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  
  # Comma-separated list of allowed headers, or "*" for all headers
  # Default: "*"
  # headers: "*"
  
  # Allow credentials (cookies, authorization headers) in CORS requests
  # Default: "true"
  # credentials: "true"
  
  # Maximum age (in seconds) for caching preflight requests
  # Default: "3600"
  # maxAge: "3600"
